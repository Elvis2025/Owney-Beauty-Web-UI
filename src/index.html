<!DOCTYPE html>
<html lang="es" data-theme="noir">
  <head>
    <meta charset="utf-8" />
    <title>Owney Beauty</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="description" content="Red social y marketplace de servicios de belleza en República Dominicana." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="assets/images/logo/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('owney.theme') || 'noir';
          var m = localStorage.getItem('owney.mode') || 'system';
          var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', t);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
